# Checks every push and pull request; deploys main to Plesk.
# Setup (GitHub variables and secrets, Plesk side): docs/deploy.md

name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Must match the Node.js version selected for the app in Plesk
  NODE_VERSION: "24"

jobs:
  check:
    runs-on: ubuntu-latest

    # Tests run against a real database: a throwaway one here
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nesiad
          POSTGRES_PASSWORD: nesiad
          POSTGRES_DB: nesiad_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Placeholders that pass env validation; tests mock email and SMS
    # defaults to dry run, so nothing is sent
    env:
      DATABASE_URL: postgresql://nesiad:nesiad@localhost:5432/nesiad_ci
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-placeholder-not-a-real-secret-0123456789
      SMTP_HOST: localhost
      SMTP_USER: ci
      SMTP_PASS: ci
      SMTP_FROM: ci@example.com
      NETGSM_USERNAME: ci
      NETGSM_PASSWORD: ci
      NETGSM_HEADER: CI

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      # PageProps / LayoutProps are generated into .next/types (gitignored)
      - run: pnpm exec next typegen
      - run: pnpm exec tsc --noEmit
      # A schema change committed without its migration (pnpm db:generate)
      # would never reach production: check reports it as a warning
      - name: Check that the migrations match the schema
        run: |
          result=$(pnpm exec drizzle-kit check --output json)
          echo "$result"
          echo "$result" | jq -e '.status == "ok" and ((.warnings // []) | length == 0)' > /dev/null
      # The same migrations production runs, on an empty database
      - run: pnpm db:migrate
      - run: pnpm test --run
      # Some breakage only shows in the build (e.g. code that runs when Next
      # loads the routes); catch it before main. Built the way deploy builds
      - run: pnpm build
        env:
          SKIP_ENV_VALIDATION: "true"

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    # Never two deploys at once; a queued one waits for the running one
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    env:
      SSH_TARGET: ${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}
      SSH_PORT: ${{ vars.SSH_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      APP_URL: ${{ vars.APP_URL }}

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Only the public URL is needed: it's baked into the client code. Every
      # secret is set in Plesk and checked when the server starts. better-auth
      # logs a "default secret" error during this build; it's harmless.
      - name: Build
        run: pnpm build
        env:
          SKIP_ENV_VALIDATION: "true"
          NEXT_PUBLIC_APP_URL: ${{ vars.APP_URL }}

      # The standalone server doesn't include static files; they go next to it
      - name: Assemble the deploy folder
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public

      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}

      # Postgres only listens on the server: forward the runner's port 5432 to
      # it over SSH, so the server's own DATABASE_URL works here unchanged.
      # Runs before the upload: if a migration fails, the old version keeps
      # running. The tunnel ends with the job
      - name: Migrate the database
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o ExitOnForwardFailure=yes \
            -fN -L 5432:localhost:5432 "$SSH_TARGET"
          pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # --delete removes files from older builds. Excluded paths are never
      # touched: Passenger's tmp/, and uploads/ in case UPLOAD_DIR was left
      # relative (it should point outside this folder)
      - name: Upload
        run: >-
          rsync -az --delete
          --exclude=/tmp/ --exclude=/uploads/ --exclude=/.env
          --exclude=/public/.well-known/
          -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT"
          .next/standalone/ "$SSH_TARGET:$DEPLOY_PATH/"

      # Passenger restarts the app on the next request after this
      - name: Restart
        run: >-
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_TARGET"
          "mkdir -p '$DEPLOY_PATH/tmp' && touch '$DEPLOY_PATH/tmp/restart.txt'"

      # Fails the run if the new version doesn't start (e.g. a missing env
      # variable makes every request a 500)
      - name: Smoke test
        run: curl -fsS -o /dev/null --retry 10 --retry-all-errors --retry-delay 3 "$APP_URL/login"
